<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1554"/>
      <stop offset="1" stop-color="#0d3b4f"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- diagonal strap -->
  <path d="M 840 -20 L 1010 -20 L 1300 330 L 1300 420 L 1230 420 Z" fill="url(#strap)" opacity="0.92"/>
  <path d="M 862 -20 L 880 -20 L 1300 486" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="10 9" fill="none"/>
  <path d="M 990 -20 L 1008 -20 L 1300 336" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="10 9" fill="none"/>

  <!-- buckle -->
  <g transform="translate(1030 182) rotate(50)">
    <rect x="-92" y="-52" width="184" height="104" rx="26" fill="#e9eefc" stroke="#ffffff" stroke-width="3"/>
    <rect x="-70" y="-30" width="140" height="60" rx="14" fill="#1a1554"/>
    <rect x="-46" y="-12" width="92" height="24" rx="12" fill="#ff5f6d"/>
  </g>

  <!-- shield with tick -->
  <g transform="translate(96 104)">
    <path d="M 40 0 L 80 14 L 80 46 C 80 72 62 90 40 100 C 18 90 0 72 0 46 L 0 14 Z" fill="#ffffff" fill-opacity="0.08" stroke="#8fb0ff" stroke-width="3"/>
    <path d="M 22 50 L 36 64 L 60 36" fill="none" stroke="#7CFFB2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="200" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-2">Seatbelt</text>
  <text x="96" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#ffffff">Vibe code like a pro developer, without being one.</text>
  <text x="96" y="294" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#b8c4ec">A free skill that makes your AI build, fix and launch apps safely, in plain English.</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="96" y="320" width="156" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="174" y="346" text-anchor="middle" fill="#ffffff">Plain English</text>
    <rect x="264" y="320" width="146" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="337" y="346" text-anchor="middle" fill="#ffffff">Save points</text>
    <rect x="422" y="320" width="152" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="498" y="346" text-anchor="middle" fill="#ffffff">Keys kept safe</text>
    <rect x="586" y="320" width="134" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="653" y="346" text-anchor="middle" fill="#ffffff">Live check</text>
    <rect x="732" y="320" width="140" height="40" rx="20" fill="#7CFFB2" fill-opacity="0.16" stroke="#7CFFB2" stroke-opacity="0.6"/>
    <text x="802" y="346" text-anchor="middle" fill="#7CFFB2">Ship check</text>
  </g>
</svg>
